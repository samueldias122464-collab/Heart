<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Você</title>
    <!-- Links Corrigidos do Brython (Mantenha exatamente estes links para o Python funcionar) -->
    <script type="text/javascript" src="https://cloudflare.com"></script>
    <script type="text/javascript" src="https://cloudflare.com"></script>
    <style>
        body {
            margin: 0;
            background-color: #05020a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #turtle-div {
            width: 700px;
            height: 700px;
            display: block;
        }
    </style>
</head>
<body onload="brython()">

    <div id="turtle-div"></div>

    <script type="text/python">
import turtle
import math
import time
from browser import document

# Comando correto para o Python injetar os gráficos na tela da Web
turtle.set_container(document["turtle-div"])

screen = turtle.Screen()
screen.setup(700, 700)
screen.bgcolor("#05020a")
screen.colormode(1.0)
screen.tracer(0)

t = turtle.Turtle()
t.hideturtle()
t.speed(0)

def heart_x(angle):
    return 16 * (math.sin(angle) ** 3)

def heart_y(angle):
    return 13 * math.cos(angle) - 5 * math.cos(2 * angle) - 2 * math.cos(3 * angle) - math.cos(4 * angle)

N = 220
outer_scale = 18.0
inner_scale = 3.0
steps = 22

c_outer = (1.00, 0.18, 0.50)
c_inner = (0.35, 0.00, 0.05)

for i in range(N):
    angle = 2 * math.pi * i / N
    
    xo = heart_x(angle) * outer_scale
    yo = heart_y(angle) * outer_scale
    
    xi = heart_x(angle) * inner_scale
    yi = heart_y(angle) * inner_scale
    
    for j in range(steps):
        f1 = j / steps
        f2 = (j + 1) / steps
        
        x1 = xo + (xi - xo) * f1
        y1 = yo + (yi - yo) * f1
        x2 = xo + (xi - xo) * f2
        y2 = yo + (yi - yo) * f2
        
        # Correção da leitura de tuplas no Brython
        r = c_outer[0] + (c_inner[0] - c_outer[0]) * f1
        g = c_outer[1] + (c_inner[1] - c_outer[1]) * f1
        b = c_outer[2] + (c_inner[2] - c_outer[2]) * f1
        
        w = 2.4 - (1.6 * f1)
        
        t.pencolor(r, g, b)
        t.width(w)
        t.penup()
        t.goto(x1, y1)
        t.pendown()
        t.goto(x2, y2)
        
    screen.update()
    time.sleep(0.015)

turtle.done()
    </script>
</body>
</html>
